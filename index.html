<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />

<meta name="theme-color" content="#0c1224" />
<style>
:root{
  /* Colores alineados al logo */
  --bg:#0b1030;             /* azul noche */
  --panel:#0f1630;          /* panel oscuro */
  --border:#1a254a;
  --text:#ecf1ff;
  --muted:#aab3df;

  /* Paleta del logo */
  --gold:#ffc447;           /* dorado BET */
  --gold-2:#ffac2e;
  --white-pear:#f7fbff;     /* blanco perlado 300 */
  --navy:#0a1230;

  /* Acciones */
  --ok:#25D366;             /* WhatsApp (se mantiene) */
}
*{box-sizing:border-box}
html,body{height:100%;scroll-behavior:smooth}
body{
  margin:0;color:var(--text);
  background:
    radial-gradient(1000px 600px at 10% -5%, rgba(255,196,71,.14), transparent),
    radial-gradient(800px 420px at 85% 5%, rgba(124,77,255,.20), transparent),
    linear-gradient(180deg,#0b1030 0%, #071022 100%);
  font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial;
}
.container{max-width:940px;margin:18px auto 96px;padding:0 14px}
.grid{display:grid;gap:14px}
@media(min-width:900px){.grid{grid-template-columns:1.1fr .9fr}}

.card{
  background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(255,255,255,.01)),var(--panel);
  border:1px solid var(--border);
  border-radius:16px;
  padding:12px;
  box-shadow:0 12px 28px rgba(0,0,0,.4);
  animation:fadeIn .8s ease;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hero{padding:12px}
h1{margin:6px 0 10px;font-size:1.6rem}
.muted{color:var(--muted)}
.badge{
  display:inline-block;padding:6px 10px;border-radius:999px;font-weight:700;font-size:12px;
  background:linear-gradient(90deg,var(--gold),#ffd978);color:#20120a;
  border:1px solid rgba(255,255,255,.08);box-shadow:0 6px 18px rgba(0,0,0,.35);
}
.row{display:flex;gap:10px;align-items:center}
.ok{color:#b3f5cf}

/* Logo centrado con glow dorado */
.head{text-align:center;margin-bottom:16px}
.logoHero{
  width:auto;max-height:86px; /* desktop */
  border-radius:10px;margin:14px auto 8px;display:block;
  filter: drop-shadow(0 0 18px rgba(255,196,71,.25)) drop-shadow(0 0 6px rgba(255,196,71,.25));
  animation:logoGlow 3.5s ease-in-out infinite;
}
@keyframes logoGlow{
  0%,100%{filter:drop-shadow(0 0 12px rgba(255,196,71,.22)) drop-shadow(0 0 4px rgba(255,196,71,.18))}
  50%{filter:drop-shadow(0 0 22px rgba(255,196,71,.40)) drop-shadow(0 0 10px rgba(255,196,71,.30))}
}
@media(max-width:560px){ .logoHero{max-height:74px} }

.brandTitle{font-weight:900;font-size:28px;letter-spacing:1px}
.badgeSub{display:inline-block;margin-top:4px}

/* Banner */
.banner{width:100%;border-radius:16px;overflow:hidden;margin-bottom:12px;
  box-shadow:0 8px 22px rgba(0,0,0,.45);
}
.banner img{width:100%;display:block;object-fit:cover}

/* Dock y botones con armonía al logo */
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:linear-gradient(180deg,rgba(10,15,30,0) 0%,rgba(10,15,30,.85) 22%,rgba(10,15,30,.98) 100%);
  padding:10px 12px 12px;display:flex;gap:10px;flex-wrap:wrap
}
.btn{
  border:none;cursor:pointer;font-weight:900;border-radius:14px;padding:14px;width:100%;
  color:#0b0f1e; /* texto oscuro sobre dorado/blanco */
  box-shadow:0 10px 24px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.06);
  transition:transform .2s ease, filter .2s ease;
}
.btn:hover{transform:translateY(-1px);filter:brightness(1.03)}
/* CTA (registro WhatsApp) – dorado */
.btn.cta{background:linear-gradient(90deg,var(--gold),var(--gold-2))}
/* Plataforma – blanco perlado con borde sutil */
.btn.platform{
  background:linear-gradient(90deg,var(--white-pear),#eaf1ff);
  color:var(--navy);
}
/* Botón “ghost” */
.btn.ghost{
  background:transparent;color:var(--text);border:1px solid var(--border);width:auto;padding:10px 12px
}

/* Code pill */
.codePill{
  display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:10px;
  background:rgba(255,196,71,.12);color:#ffe2a8;border:1px solid rgba(255,196,71,.35);
  font-weight:800;font-variant-numeric:tabular-nums;margin-left:6px;
}

/* Video */
.videoWrap{
  border:1px solid var(--border);border-radius:14px;overflow:hidden;background:#0a1329
}
.videoWrap video{width:100%;display:block}
@media(max-width:560px){
  .container{margin-bottom:90px}
  .btn{padding:13px}
}
</style>
</head>
<body>
  <div class="container">
    <div class="head">
      <!-- Subí el archivo a /public/bet300-logo.png o al mismo nivel del HTML -->
      <img src="bet300-logo.png" alt="Bet300 Logo" class="logoHero" loading="eager" decoding="async">
      <div class="brandTitle">BET300</div>
      <span class="badge badgeSub">🎰 Plataforma oficial – Jugá con seguridad</span><br>
      <button id="btnCond" class="btn ghost" style="margin-top:10px">Condiciones</button>
    </div>

    <div class="grid">
      <section class="card hero">
        <div class="banner">
          <img src="joker-banner.jpg" alt="BET300 promoción – personajes de slots" loading="lazy">
        </div>

        <span class="badge">🎁 Bienvenido</span>
        <h1>30% EXTRA <b>EN TU PRIMERA CARGA</b></h1>

        <div class="row"><span class="ok">✔</span> Número de WhatsApp siempre actualizado en la plataforma.</div>
        <div class="row"><span class="ok">✔</span> Carga y retiro al instante.</div>
        <div class="row"><span class="ok">✔</span> Atención 24 hs <span id="codeTag" class="codePill">—</span></div>

        <div style="margin-top:10px" class="row">
          <button id="btnRegister" class="btn cta">🎁 REGISTRATE por WhatsApp</button>
          <button id="btnPlatform" class="btn platform">🌐 Ingresar a la Plataforma</button>
        </div>

        <div id="videoBox" class="videoWrap" style="margin-top:12px;display:none">
          <video id="howto" playsinline controls poster="">
            <source src="video.mp4" type="video/mp4">
          </video>
        </div>
      </section>
    </div>
  </div>

  <div class="dock">
    <button id="btnRegisterBottom" class="btn cta">🎁 REGISTRATE</button>
    <button id="btnPlatformBottom" class="btn platform">🌐 Ingresar a la Plataforma</button>
  </div>

<script>
/* ========= Config ========= */
/* WhatsApp por PC */
const WP_NUMBERS = {
  pc1: "5491133117089",
  pc2: "5491171394765",
  pc3: "5491172342259",
  pc4: "5491134970581"
};
/* Plataforma por PC (4 links distintos) */
const PLATFORM_URLS = {
  pc1: "https://300vip-c01.vercel.app/",
  pc2: "https://300vip-c02.vercel.app/",
  pc3: "https://300vip-c03.vercel.app/",
  pc4: "https://alvge.bet300vip.com/"
};
const PLATFORM_FALLBACK = "https://bet300.biz";

/* ========= Utilidades ========= */
const params = new URLSearchParams(location.search);
const pcParam = (params.get("pc") || "1").trim();
const pcKey   = "pc" + (pcParam.match(/^[1-4]$/) ? pcParam : "1");
const WP      = WP_NUMBERS[pcKey];
const PLATFORM = PLATFORM_URLS[pcKey] || PLATFORM_FALLBACK;

/* ID único simple */
function ensureDeviceId(){
  let id = localStorage.getItem('b3_device');
  if(!id){
    id = (crypto.randomUUID?.() || `${Date.now()}-${Math.random().toString(36).slice(2,10)}`);
    localStorage.setItem('b3_device', id);
  }
  return id;
}
const DEVICE_ID = ensureDeviceId();
function todayKey(){const n=new Date();return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;}
function tsString(d=new Date()){return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;}
async function sha256hex(msg){if(!crypto?.subtle)return null;try{const enc=new TextEncoder().encode(msg);const buf=await crypto.subtle.digest("SHA-256",enc);return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");}catch{return null;}}
async function makeCode(){const salt="bet300-reg-30v1";const base=`${DEVICE_ID}|${todayKey()}|pc:${pcParam}|${salt}|${Math.random()}`;const hex=await sha256hex(base);const raw=hex||Math.random().toString(36).slice(2)+Date.now().toString(36);return raw.slice(0,8).toUpperCase();}

/* Mostrar video si existe */
fetch('video.mp4',{method:'HEAD'}).then(r=>{if(r.ok)document.getElementById('videoBox').style.display='block';}).catch(()=>{});

/* ========= Acciones ========= */
async function goRegister(){
  const code=await makeCode();
  localStorage.setItem('b3_reg_code',code);
  localStorage.setItem('b3_reg_ts',tsString());
  document.getElementById('codeTag').textContent=code;

  const text=`Hola, quiero crear mi usuario en BET300 y reclamar el 30% EXTRA en mi primera carga automática.
• Código: ${code}
• Fecha/Hora: ${tsString()}

¿Me ayudás con el alta?`;
  location.href=`https://wa.me/${WP}?text=${encodeURIComponent(text)}`;
}
function goPlatform(){location.href=PLATFORM+(PLATFORM.includes('?')?`&pc=${pcParam}`:`?pc=${pcParam}`);}

/* Wire */
document.getElementById('btnRegister').onclick=goRegister;
document.getElementById('btnRegisterBottom').onclick=goRegister;
document.getElementById('btnPlatform').onclick=goPlatform;
document.getElementById('btnPlatformBottom').onclick=goPlatform;
document.getElementById('btnCond').onclick=()=>alert(`CONDICIONES PROMO 30% EXTRA
— Solo para la primera carga automática del usuario nuevo.
— Código personal e intransferible (vence hoy).
— Cargas y retiros instantáneos desde la plataforma.
— Soporte 24/7.
— Sujeto a verificación BET300.`);

/* Mostrar el código previo si existe */
const c=localStorage.getItem('b3_reg_code');if(c)document.getElementById('codeTag').textContent=c;
</script>
</body>
</html>
